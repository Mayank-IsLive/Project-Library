<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My library</title>
    <!-- stylesheets -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- main Container -->
    <div class="main-container">
      <div class="header">
        <div class="logo">My Library</div>
        <ul>
          <li><button id="addNewBook">+ add book</button></li>
        </ul>
      </div>
      <!-- library -->
      <div class="library"></div>

      <!-- add book form -->
      <div class="overlay">
        <div class="form">
          <div class="form-header">
            <div>
              <h2>Add Book !</h2>
            </div>
            <div>
              <button id="closebtn">X</button>
            </div>
          </div>
          <div class="form-control">
            <form action="#" id="myform">
              <div>
                <label for="bookName">Book Name</label>
                <input
                  type="text"
                  name="bookName"
                  id="bookName"
                  placeholder="Atomic habbit..."
                  required
                />
              </div>
              <div>
                <label for="bookAuthor">Author</label>
                <input
                  type="text"
                  name="bookAuthor"
                  id="bookAuthor"
                  placeholder="M.s. Dhoni"
                  required
                />
              </div>
              <div>
                <label for="pages">Pages</label>
                <input
                  type="number"
                  name="pages"
                  id="pages"
                  placeholder="235"
                  required
                  min="1"
                />
              </div>
              <div>
                <label for="readStatus" id="read">Read Yet ?</label>
                <select name="readStatus" id="readStatus">
                  <option value="yes">Yes</option>
                  <option value="no">No</option>
                </select>
              </div>
              <button type="submit" id="submit-btn">Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Script -->
    <script src="app.js"></script>
  </body>
</html>
